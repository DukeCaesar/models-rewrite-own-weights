[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-rewrite-reproduction"
version = "0.1.0"
description = "Independent reproduction of arXiv:2611.21885"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "numpy>=1.24", "scipy>=1.10", "safetensors>=0.4"]

[project.optional-dependencies]
inference = ["transformers>=5.2", "accelerate>=1.0", "math-verify>=0.8", "datasets>=3.0", "Pillow>=10"]
data = ["pyarrow>=15", "Pillow>=10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
self-rewrite = "self_rewrite.cli:main"
